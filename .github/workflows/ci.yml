name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test configuration
        run: swift test --package-path macos

      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Enable the pinned build environment
        run: |
          nix profile add --inputs-from ./VeloKit nixpkgs#direnv
          direnv allow VeloKit

      - name: Build app and run Core tests
        run: |
          xcodebuild -project macos/Velocitty.xcodeproj -scheme Velocitty \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath macos/build \
            -testPlan Core -resultBundlePath macos/build/Core.xcresult test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-test-results
          path: macos/build/Core.xcresult
          if-no-files-found: ignore
